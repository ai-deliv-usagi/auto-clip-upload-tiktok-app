<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>連携処理中 | AI実況動画投稿</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1d232b;
      --muted: #5d6875;
      --accent: #00a6a6;
      --border: #d9dee5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
    }

    main {
      width: min(92vw, 520px);
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 48px rgba(22, 30, 39, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.35rem;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .status {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--text);
      font-weight: 600;
    }

    .ok {
      color: var(--accent);
    }

    textarea {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.85rem;
      resize: vertical;
    }

    button {
      margin-top: 12px;
      padding: 8px 16px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
    }

    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>TikTok連携</h1>
    <p>AI実況動画投稿の認可結果です。このページは結果を表示するだけで、どこにも送信しません。</p>
    <p id="status" class="status">認可結果を確認しています...</p>
    <div id="result" hidden>
      <p>下の文字列をコピーして、PCで実行中の <code>tiktok_auth.py</code> に貼り付けてください。数分で無効になります。</p>
      <textarea id="callback" rows="4" readonly></textarea>
      <button id="copy" type="button">コピー</button>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");
    const statusEl = document.getElementById("status");

    function show(message, className) {
      statusEl.textContent = message;
      statusEl.className = className ? `status ${className}` : "status";
    }

    if (error || !code) {
      show("連携がキャンセルされたか、失敗しました。PCの画面からやり直してください。");
    } else {
      const result = new URLSearchParams();
      result.set("code", code);
      if (params.get("state")) {
        result.set("state", params.get("state"));
      }
      const box = document.getElementById("callback");
      box.value = result.toString();
      document.getElementById("result").hidden = false;
      show("許可されました。", "ok");
      document.getElementById("copy").addEventListener("click", async () => {
        box.select();
        try {
          await navigator.clipboard.writeText(box.value);
          show("コピーしました。PCの画面に貼り付けてください。", "ok");
        } catch (err) {
          show("自動コピーできませんでした。文字列を選択してコピーしてください。");
        }
      });
    }
    // 履歴やブックマークにコードを残さない
    history.replaceState(null, "", window.location.pathname);
  </script>
</body>
</html>
