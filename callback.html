<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>連携処理中 | AI実況動画投稿</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1d232b;
      --muted: #5d6875;
      --accent: #00a6a6;
      --border: #d9dee5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
    }

    main {
      width: min(92vw, 520px);
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 48px rgba(22, 30, 39, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.35rem;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .status {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--text);
      font-weight: 600;
    }

    .ok {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>TikTok連携</h1>
    <p>AI実況動画投稿との連携を処理しています。</p>
    <p id="status" class="status">連携処理中です...</p>
  </main>

  <script>
    const CLOUD_RUN_ENDPOINT = "https://ai-delivery-tiktok-oauth-ddq5wqsedq-an.a.run.app/api/tiktok/oauth/callback";
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const state = params.get("state");
    const error = params.get("error");
    const statusEl = document.getElementById("status");

    function show(message, className) {
      statusEl.textContent = message;
      statusEl.className = className ? `status ${className}` : "status";
    }

    if (error || !code) {
      show("連携がキャンセルされました。");
    } else if (!state) {
      show("連携に失敗しました。時間をおいて再度お試しください。");
    } else {
      fetch(CLOUD_RUN_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code, state }),
      })
        .then((res) => res.json())
        .then((data) => {
          if (data.status === "ok") {
            show("連携が完了しました。この画面は閉じて構いません。", "ok");
          } else {
            show("連携に失敗しました。時間をおいて再度お試しください。");
          }
        })
        .catch((err) => {
          console.error("TikTok OAuth callback failed", err);
          show("連携処理中にエラーが発生しました。");
        });
    }
  </script>
</body>
</html>
